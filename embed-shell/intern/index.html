<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Container Studio - Intern</title>
    <!--
      Shell-Unterseite fuer den internen Mitarbeiterbereich (2026-08-25,
      Jonas' Vorgabe: "es soll ALLES ueber die Shell laufen, nicht dass man
      auf das Backend zugreifen muss"). Bisher war /intern direkt auf der
      rohen Backend-URL (containerconfigurator.netlify.app/intern) erreichbar
      - das widerspricht dem Gesamtkonzept dieser Shell-Architektur. Jetzt:
      genau dieselbe iframe+Schluessel-Handshake-Mechanik wie die
      Haupt-Shell-Seite (index.html im selben Ordner), nur mit dem
      Backend-Pfad /intern statt /. Damit ist hayse.de/intern der einzige
      offizielle Weg zum internen Bereich - per direktem Aufruf/Lesezeichen
      ODER per "Interner Bereich"-Menuepunkt im "?"-Menue der App
      (layout/AppShell.tsx), der auf genau diese URL navigiert.

      Bewusst OHNE Kunden-Konfigurationsblock (anders als index.html) - der
      interne Bereich ist LC Systems' eigenes Werkzeug, keine White-Label-
      Funktion, braucht also keine ueberschreibbaren Geschaeftswerte.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b0c;
      }
      #app-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      id="app-frame"
      title="Container Studio - Intern"
      src="https://containerconfigurator.netlify.app/intern"
      allow="fullscreen; hid; clipboard-write"
      loading="eager"
    ></iframe>
    <script>
      (function () {
        var APP_ORIGIN = "https://containerconfigurator.netlify.app";
        var EMBED_ACCESS_KEY = "YsEy6JohTmFxm9FhPs1jnEfuJEwc5x5c";
        var frame = document.getElementById("app-frame");

        window.addEventListener("message", function (event) {
          if (event.origin !== APP_ORIGIN) return;
          if (event.source !== frame.contentWindow) return;
          if (!event.data || event.data.type !== "embed-ready") return;
          frame.contentWindow.postMessage(
            { type: "embed-auth", key: EMBED_ACCESS_KEY },
            APP_ORIGIN
          );
        });
      })();
    </script>
  </body>
</html>
