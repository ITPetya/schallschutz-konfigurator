<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Container Studio - der interaktive 3D-Konfigurator fuer Container."
    />
    <title>Container Studio</title>
    <!--
      Diese Seite ist bewusst die GESAMTE hayse.de-Startseite: nur ein
      Vollbild-iframe, der die eigentliche Anwendung von einer separaten
      Netlify-Seite laedt (Jonas' Vorgabe 2026-08-25 - hayse.de soll selbst
      nur wenige KB sein, der schwere Code lebt auf einer eigenen URL, aehnlich
      Cloud-/Remote-Gaming-Streaming). Der iframe-src unten ist die einzige
      Stelle, die bei einer Domain-Aenderung angepasst werden muss.

      Der ?key=... Parameter ist Absicht (2026-08-25): eine Netlify Edge
      Function auf containerconfigurator.netlify.app (netlify/edge-functions/
      embed-gate.ts im Haupt-Repo) blockt Direktaufrufe der rohen App-URL ohne
      diesen Schluessel - kein echter Zugangsschutz, nur eine Huerde gegen
      zufaelliges Weiterreichen des gefundenen iframe-Links. Bei Aenderung des
      Schluessels: hier UND in der Netlify-Umgebungsvariable
      EMBED_ACCESS_KEY (Projekt "containerconfigurator") synchron halten.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b0c;
      }
      #app-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #e5e5e5;
        background: #0b0b0c;
        text-align: center;
        padding: 2rem;
      }
      .fallback a {
        color: #7db8ff;
      }
    </style>
  </head>
  <body>
    <iframe
      id="app-frame"
      title="Container Studio"
      src="https://containerconfigurator.netlify.app/?key=YsEy6JohTmFxm9FhPs1jnEfuJEwc5x5c"
      allow="fullscreen"
      loading="eager"
    ></iframe>
    <noscript>
      <div class="fallback">
        Bitte aktiviere JavaScript, um den Konfigurator zu nutzen, oder
        besuche
        <a href="https://containerconfigurator.netlify.app/?key=YsEy6JohTmFxm9FhPs1jnEfuJEwc5x5c"
          >die Anwendung direkt</a
        >.
      </div>
    </noscript>
  </body>
</html>
