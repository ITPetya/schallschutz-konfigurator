<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Container Studio - der interaktive 3D-Konfigurator fuer Container."
    />
    <title>Container Studio</title>
    <!--
      Diese Seite ist bewusst die GESAMTE hayse.de-Startseite: nur ein
      Vollbild-iframe, der die eigentliche Anwendung von einer separaten
      Netlify-Seite laedt (Jonas' Vorgabe 2026-08-25 - hayse.de soll selbst
      nur wenige KB sein, der schwere Code lebt auf einer eigenen URL, aehnlich
      Cloud-/Remote-Gaming-Streaming). APP_ORIGIN unten ist die einzige
      Stelle, die bei einer Domain-Aenderung angepasst werden muss.

      Der Zugriffs-Schluessel steht bewusst NICHT im iframe-src (siehe
      src/config/embedGate.ts im Haupt-Repo fuer die volle Begruendung -
      kurz: ein Key als URL-Parameter ist per "Element untersuchen" sofort
      sichtbar und kopierbar). Stattdessen ein postMessage-Handshake: die
      App piept beim Start "embed-ready", diese Seite antwortet mit dem
      Schluessel, gezielt an APP_ORIGIN statt "*". Bei Aenderung des
      Schluessels: hier UND in src/config/embedGate.ts (EMBED_ACCESS_KEY)
      synchron halten.

      STANDARD_CONFIG unten (2026-08-25) faehrt im selben Handshake mit:
      Kunden-spezifische Geschaeftswerte, damit Jonas den App-Quellcode
      unabhaengig vom Website-Baukasten seiner Kunden weiterpflegen kann -
      jeder Kunde traegt nur seine eigenen Werte hier ein, alles Weggelassene
      bleibt beim LC-Systems-Standard. Siehe src/config/embedStandardConfig.ts
      fuer die App-seitige Verarbeitung.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b0c;
      }
      #app-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #e5e5e5;
        background: #0b0b0c;
        text-align: center;
        padding: 2rem;
      }
      .fallback a {
        color: #7db8ff;
      }
    </style>
  </head>
  <body>
    <iframe
      id="app-frame"
      title="Container Studio"
      src="https://containerconfigurator.netlify.app/"
      allow="fullscreen"
      loading="eager"
    ></iframe>
    <noscript>
      <div class="fallback">
        Bitte aktiviere JavaScript, um den Konfigurator zu nutzen.
      </div>
    </noscript>
    <script>
      // -----------------------------------------------------------------
      // Kunden-Konfiguration: hier eintragen, was von den LC-Systems-
      // Standardwerten abweichen soll. ALLE Felder sind optional - weglassen
      // (bzw. auf null/undefined lassen) heisst "Standardwert verwenden".
      // -----------------------------------------------------------------
      var STANDARD_CONFIG = {
        // requestEmail: "info@deine-firma.de",
        // contactUrl: "https://deine-firma.de/kontakt/",
        // dimensionLimits: {
        //   length: { min: 1000, max: 12000 },
        //   width: { min: 1000, max: 4500 },
        //   height: { min: 1000, max: 3000 },
        // },
        // standardWallThickness: 80,
        // soundClasses: {
        //   standard: { rangeLabel: "R'w 30-34 dB" },
        //   schallschutz: { label: "Ruhig", rangeLabel: "R'w 40-44 dB" },
        // },
      };

      (function () {
        var APP_ORIGIN = "https://containerconfigurator.netlify.app";
        var EMBED_ACCESS_KEY = "YsEy6JohTmFxm9FhPs1jnEfuJEwc5x5c";
        var frame = document.getElementById("app-frame");

        window.addEventListener("message", function (event) {
          if (event.origin !== APP_ORIGIN) return;
          if (event.source !== frame.contentWindow) return;
          if (!event.data || event.data.type !== "embed-ready") return;
          frame.contentWindow.postMessage(
            { type: "embed-auth", key: EMBED_ACCESS_KEY, config: STANDARD_CONFIG },
            APP_ORIGIN
          );
        });
      })();
    </script>
  </body>
</html>
