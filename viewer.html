<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Container Ansicht</title>
    <!--
      Bewusst KEIN Import von src/index.css hier (Jonas' Vorgabe 2026-08-19,
      eigenstaendig einbettbarer Viewer, siehe src/viewer/entry.tsx) - alle
      Bedienelemente (Farbpunkte, Farbrad, Preset-Auswahl, Personalisieren-
      Button, Lade-Overlay) sind bewusst reines Inline-Styling statt
      Tailwind-Klassen - ein Tailwind-/Font-Stylesheet einzubinden wuerde nur
      unnoetig Gewicht in ein Embed-Bundle ziehen, das auf einer fremden
      Webseite in einem iframe landet. Die Dreh-Animation des Lade-Icons
      (siehe entry.tsx's LoadingOverlay) braucht trotzdem eine @keyframes-
      Regel irgendwo im Dokument - hier statt einer eigenen <style>-Injektion
      per JS, spart eine Laufzeit-Umstaendlichkeit fuer eine einzige Regel.
      1:1 identisch zu index.css' .ssk-spin-slow (siehe dortiger Kommentar,
      warum reines CSS statt einer JS/rAF-getriebenen Animation).
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #viewer-root {
        width: 100%;
        height: 100%;
      }
      @keyframes viewer-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .viewer-spin {
        animation: viewer-spin 2s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .viewer-spin {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="viewer-root"></div>
    <script type="module" src="/src/viewer/entry.tsx"></script>
  </body>
</html>
